# Render deployment configuration.
#
# WHY EXTERNAL CRON, NOT APSCHEDULER
# ───────────────────────────────────
# Render free-tier web services spin down after 15 minutes of inactivity.
# A sleeping process cannot fire an APScheduler job.  The hourly crawl is
# therefore triggered by the GitHub Actions scheduled workflow in this repo
# (.github/workflows/crawl.yml), which sends:
#
#   POST https://<your-service>.onrender.com/api/crawl/run
#   X-Crawl-Secret: <value of MC_CRAWL_SECRET>
#
# This request wakes the instance and starts the crawl.  APScheduler is
# disabled on Render (MC_SCHEDULER_ENABLED=false) but POST /api/crawl/run
# remains live for the workflow trigger.
#
# EPHEMERAL DATABASE
# ──────────────────
# The free plan has no persistent disk add-on.  MC_DB_URL points into the
# container filesystem (/data), which is created by the Dockerfile but is
# NOT durable across restarts or deploys.  seeds/seed.json is the durable
# copy — restore_if_empty() loads it automatically on every boot so the
# service always starts with data without running any crawls.
#
# CRAWL SECRET
# ────────────
# MC_CRAWL_SECRET is auto-generated by Render on first deploy.  Copy the
# value from the Render dashboard and store it as a GitHub Actions secret
# named CRAWL_SECRET so the workflow can include it in the request header.
# The secret is never committed to the repository.  If MC_CRAWL_SECRET is
# unset the endpoint refuses all requests — there is no open-access mode.

services:
  - type: web
    name: metacrawl
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # MC_DB_URL points into the container filesystem.  /data is created by
      # the Dockerfile (chmod 777) but is ephemeral on the free plan.
      # seeds/seed.json is the durable copy; restore_if_empty() reseeds on boot.
      - key: MC_DB_URL
        value: sqlite:////data/metacrawl.db
      - key: MC_CRAWL_SECRET
        generateValue: true      # Render generates a random secret on first deploy
      - key: MC_SCHEDULER_ENABLED
        value: "false"
      - key: MC_LLM_PROVIDER
        value: openai-compatible
      - key: MC_LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: MC_LLM_API_KEY
        sync: false              # set in Render dashboard — never committed
      - key: MC_LLM_MODEL
        value: llama-3.3-70b-versatile   # Groq production, 131k context window
      - key: MC_EMBED_PROVIDER
        value: ""                # embedder disabled; similarity falls back to metadata overlap
