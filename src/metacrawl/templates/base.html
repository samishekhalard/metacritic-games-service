<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Metacrawl{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
</head>
<body>
<header class="site-header">
  <a href="/" class="site-title">Metacrawl</a>
  <div class="header-actions">
    <span id="crawl-badge"
          hx-get="/api/crawl/status"
          hx-trigger="load, every 10s"
          hx-swap="outerHTML"
          hx-target="#crawl-badge"></span>
    <button class="btn"
            hx-post="/api/crawl/run"
            hx-swap="outerHTML"
            hx-target="#crawl-badge">Run crawl</button>
  </div>
</header>
<main class="site-main">
{% block content %}{% endblock %}
</main>
</body>
</html>
